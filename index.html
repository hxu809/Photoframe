<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动相框 - Interactive Photoframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            width: 100vw;
            background: #ffffff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
        }

        /* 响应式缩放 */
        @media screen and (max-height: 1080px) {
            .container {
                transform: scale(0.7);
            }
        }

        @media screen and (max-height: 900px) {
            .container {
                transform: scale(0.6);
            }
        }

        @media screen and (max-height: 720px) {
            .container {
                transform: scale(0.5);
            }
        }

        @media screen and (max-width: 1920px) {
            .container {
                transform: scale(0.65);
            }
        }

        @media screen and (max-width: 1600px) {
            .container {
                transform: scale(0.55);
            }
        }

        @media screen and (max-width: 1366px) {
            .container {
                transform: scale(0.45);
            }
        }

        /* Monsterframe相框 - 居中显示 */
        #monsterframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            z-index: 1;
        }

        /* 画作点击区域 */
        .artwork-clickarea {
            position: absolute;
            left: 485px;
            top: 178px;
            width: 950px;
            height: 724px;
            z-index: 10;
            cursor: pointer;
        }

        /* 画作提示 */
        .artwork-hint {
            display: none;
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #d4a574;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            z-index: 100;
            animation: pulse 2s infinite;
        }

        .artwork-hint.show {
            display: block;
            opacity: 1;
        }

        /* 放大渐变过渡效果 */
        .zoom-transition {
            animation: zoomOut 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes zoomOut {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* 星空漩涡吸入效果 - 黑色放大旋转 */
        .vortex-transition {
            animation: vortexSpin 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .vortex-transition::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: -1;
            animation: fadeInBlack 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes vortexSpin {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            30% {
                transform: scale(1.3) rotate(180deg);
                opacity: 0.9;
            }
            60% {
                transform: scale(1.8) rotate(540deg);
                opacity: 0.7;
            }
            100% {
                transform: scale(3) rotate(1080deg);
                opacity: 0;
            }
        }

        @keyframes fadeInBlack {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Monsterframe相框 -->
        <object id="monsterframe" data="Monsterframe.svg" type="image/svg+xml"></object>

        <!-- 画作点击区域 -->
        <div class="artwork-clickarea" id="artworkClickArea"></div>
    </div>

    <div class="artwork-hint" id="artworkHint">🎨 点击画作或按 Enter 进入动态效果 🎨</div>

    <!-- Transition sound effect -->
    <audio id="transitionSound" preload="auto">
        <source src="转场.mp3" type="audio/mpeg">
    </audio>

    <script>
        let currentIndex = 0;
        let isScrolling = false;
        let lastScrollTime = 0;
        const SCROLL_COOLDOWN = 600; // 滚动冷却时间（毫秒）

        // 获取元素
        const monsterframe = document.getElementById('monsterframe');
        const artworkClickArea = document.getElementById('artworkClickArea');
        const artworkHint = document.getElementById('artworkHint');
        const container = document.querySelector('.container');
        const TOTAL_ARTWORKS = 4;

        // 画作索引常量
        const GUOHUA_INDEX = 0;
        const STARRYSKY_INDEX = 1;
        const UKIYOE_INDEX = 2;
        const PICASSO_INDEX = 3;

        // 画作信息配置
        const artworkInfo = {
            0: {
                name: '国画',
                hint: '🖌️ 点击画作或按 Enter 进入动态国画 🖌️',
                url: 'guohua.html',
                svgFile: 'Guohua.svg'
            },
            1: {
                name: '星空',
                hint: '⭐ 点击画作或按 Enter 进入动态星空 ⭐',
                url: 'starrysky.html',
                svgFile: 'Starrysky.svg'
            },
            2: {
                name: '浮世绘',
                hint: '🌊 点击画作或按 Enter 进入动态浮世绘 🌊',
                url: 'ukiyoe.html',
                svgFile: 'Ukiyoe.svg'
            },
            3: {
                name: '毕加索',
                hint: '🎨 点击画作或按 Enter 进入动态毕加索 🎨',
                url: 'picasso.html',
                svgFile: 'Picasso.svg'
            }
        };

        let svgDoc = null;
        let ukiyoeGroup = null;
        let leftEyeball = null;
        let rightEyeball = null;

        // 眼球参数
        const leftEyeCenter = { x: 431, y: 110 };  // 左眼眶中心
        const rightEyeCenter = { x: 1475, y: 110 }; // 右眼眶中心
        const eyeRadius = 40; // 眼球可移动的最大半径

        // 等待SVG加载完成
        monsterframe.addEventListener('load', function() {
            svgDoc = monsterframe.contentDocument;
            if (svgDoc) {
                ukiyoeGroup = svgDoc.getElementById('Ukiyoe');
                leftEyeball = svgDoc.getElementById('Lefteyeball');
                rightEyeball = svgDoc.getElementById('Righteyeball');

                if (ukiyoeGroup) {
                    console.log('✅ Monsterframe.svg 加载成功');
                    console.log('✅ Ukiyoe 组找到');

                    // 初始化显示第一个画作
                    updateArtwork(currentIndex);
                    updateArtworkHint();
                } else {
                    console.error('❌ 未找到 Ukiyoe 组');
                }

                if (leftEyeball && rightEyeball) {
                    console.log('✅ 眼球元素找到');
                    // 启动眼球跟随鼠标
                    setupEyeTracking();
                } else {
                    console.error('❌ 未找到眼球元素');
                }
            }
        });

        // 更新画作显示（带滚动效果）
        function updateArtwork(index, direction = 'none') {
            if (!svgDoc || !ukiyoeGroup) return;

            const info = artworkInfo[index];
            if (!info) return;

            console.log(`🔄 切换到: ${info.name}, 方向: ${direction}`);

            // 如果是初始化，直接显示不需要动画
            if (direction === 'none') {
                clearAndShowArtwork(info);
                return;
            }

            // 获取当前的foreignObject
            const currentFO = ukiyoeGroup.querySelector('foreignObject');

            if (!currentFO) {
                clearAndShowArtwork(info);
                return;
            }

            // 创建新的画作（在视野外）
            const newFO = createArtworkElement(info, direction === 'down' ? 724 : -724);
            ukiyoeGroup.appendChild(newFO);

            // 获取当前和新的div容器
            const currentDiv = currentFO.querySelector('div');
            const newDiv = newFO.querySelector('div');

            // 添加过渡效果
            currentDiv.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            newDiv.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';

            // 触发动画
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // 当前画作滑出
                    const currentOffset = direction === 'down' ? -724 : 724;
                    currentDiv.style.transform = `translateY(${currentOffset}px)`;

                    // 新画作滑入
                    newDiv.style.transform = 'translateY(0)';
                });
            });

            // 动画结束后清理
            setTimeout(() => {
                if (currentFO && currentFO.parentNode) {
                    ukiyoeGroup.removeChild(currentFO);
                }
            }, 650);
        }

        // 创建画作元素
        function createArtworkElement(info, offsetY = 0) {
            // 创建foreignObject来嵌入图片
            const foreignObject = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
            foreignObject.setAttribute('x', '485');
            foreignObject.setAttribute('y', '178');
            foreignObject.setAttribute('width', '950');
            foreignObject.setAttribute('height', '724');

            // 创建div容器
            const div = document.createElement('div');
            div.style.width = '100%';
            div.style.height = '100%';
            div.style.display = 'flex';
            div.style.justifyContent = 'center';
            div.style.alignItems = 'center';
            div.style.overflow = 'hidden';
            div.style.transform = `translateY(${offsetY}px)`;

            // 创建img元素
            const img = document.createElement('img');
            img.src = info.svgFile;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.width = 'auto';
            img.style.height = 'auto';
            img.style.objectFit = 'contain';

            div.appendChild(img);
            foreignObject.appendChild(div);

            return foreignObject;
        }

        // 清空并显示画作（无动画）
        function clearAndShowArtwork(info) {
            // 清空现有内容
            while (ukiyoeGroup.firstChild) {
                ukiyoeGroup.removeChild(ukiyoeGroup.firstChild);
            }

            const foreignObject = createArtworkElement(info, 0);
            ukiyoeGroup.appendChild(foreignObject);
        }

        // 检查并更新画作提示
        function updateArtworkHint() {
            const info = artworkInfo[currentIndex];
            artworkHint.textContent = info.hint;
            artworkHint.classList.add('show');
        }

        // 跳转到动态页面
        function goToDynamicArtwork() {
            const info = artworkInfo[currentIndex];
            if (!info) return;

            // 播放转场音效
            const transitionSound = document.getElementById('transitionSound');
            if (transitionSound) {
                transitionSound.currentTime = 0;
                transitionSound.play().catch(error => {
                    console.error('Failed to play transition sound:', error);
                });
                console.log('🔊 Playing transition sound effect');
            }

            // 所有画作都使用黑色放大旋转的漩涡吸入效果
            container.classList.add('vortex-transition');
            // 动画时间为1.5秒
            setTimeout(() => {
                window.location.href = info.url;
            }, 1500);
        }

        // 切换到指定画作
        function switchToArtwork(index, direction = 'down') {
            if (index === currentIndex || isScrolling) return;

            // 防抖控制
            isScrolling = true;

            // 更新当前索引
            const oldIndex = currentIndex;
            currentIndex = index;

            // 确定滚动方向
            let scrollDirection = 'down';
            if (direction === 'up' || index < oldIndex) {
                scrollDirection = 'up';
            }

            // 更新画作显示（带滚动效果）
            updateArtwork(currentIndex, scrollDirection);

            // 更新画作提示
            updateArtworkHint();

            // 解除防抖
            setTimeout(() => {
                isScrolling = false;
            }, 700);
        }

        // 滚轮事件监听
        document.addEventListener('wheel', (e) => {
            e.preventDefault();

            const currentTime = Date.now();

            // 检查是否在冷却时间内
            if (isScrolling || (currentTime - lastScrollTime) < SCROLL_COOLDOWN) {
                return;
            }

            lastScrollTime = currentTime;

            // 只响应明显的滚动动作
            if (Math.abs(e.deltaY) > 10) {
                if (e.deltaY > 0) {
                    // 向下滚动 - 下一张（画作向上移动）
                    const nextIndex = (currentIndex + 1) % TOTAL_ARTWORKS;
                    switchToArtwork(nextIndex, 'down');
                } else {
                    // 向上滚动 - 上一张（画作向下移动）
                    const prevIndex = (currentIndex - 1 + TOTAL_ARTWORKS) % TOTAL_ARTWORKS;
                    switchToArtwork(prevIndex, 'up');
                }
            }
        }, { passive: false });

        // 键盘事件监听
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                const nextIndex = (currentIndex + 1) % TOTAL_ARTWORKS;
                switchToArtwork(nextIndex, 'down');
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                const prevIndex = (currentIndex - 1 + TOTAL_ARTWORKS) % TOTAL_ARTWORKS;
                switchToArtwork(prevIndex, 'up');
            } else if (e.key === 'Enter') {
                // 按Enter键跳转到动态页面
                goToDynamicArtwork();
            }
        });

        // 点击画作区域跳转到动态页面
        artworkClickArea.addEventListener('click', () => {
            goToDynamicArtwork();
        });

        // 眼球跟随鼠标
        function setupEyeTracking() {
            document.addEventListener('mousemove', (event) => {
                if (!leftEyeball || !rightEyeball) return;

                // 获取鼠标在页面中的位置
                const mouseX = event.clientX;
                const mouseY = event.clientY;

                // 获取容器的位置和缩放
                const containerRect = container.getBoundingClientRect();
                const containerCenterX = containerRect.left + containerRect.width / 2;
                const containerCenterY = containerRect.top + containerRect.height / 2;

                // 计算缩放比例
                const scaleMatch = window.getComputedStyle(container).transform.match(/matrix\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)/);
                const scale = scaleMatch ? parseFloat(scaleMatch[1]) : 1;

                // 将鼠标位置转换为相对于1920x1080画布的坐标
                const canvasMouseX = (mouseX - containerCenterX) / scale + 1920 / 2;
                const canvasMouseY = (mouseY - containerCenterY) / scale + 1080 / 2;

                // 更新左眼球位置
                updateEyeball(leftEyeball, leftEyeCenter, canvasMouseX, canvasMouseY);

                // 更新右眼球位置
                updateEyeball(rightEyeball, rightEyeCenter, canvasMouseX, canvasMouseY);
            });
        }

        function updateEyeball(eyeballGroup, eyeCenter, mouseX, mouseY) {
            // 计算鼠标相对于眼睛中心的向量
            const dx = mouseX - eyeCenter.x;
            const dy = mouseY - eyeCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 计算眼球应该移动的位置（限制在眼眶范围内）
            let offsetX, offsetY;
            if (distance > eyeRadius) {
                // 如果距离超过眼眶半径，限制在边缘
                offsetX = (dx / distance) * eyeRadius;
                offsetY = (dy / distance) * eyeRadius;
            } else {
                // 否则直接跟随鼠标
                offsetX = dx;
                offsetY = dy;
            }

            // 应用transform移动眼球
            eyeballGroup.setAttribute('transform', `translate(${offsetX}, ${offsetY})`);
        }
    </script>
</body>
</html>
