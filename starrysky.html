<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态星空 - Dynamic Starry Sky</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a1628;
            overflow: hidden;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* SVG 容器 */
        .svg-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            animation: starGlow 6s ease-in-out infinite;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 星光闪烁效果 */
        @keyframes starGlow {
            0%, 100% {
                filter: brightness(1) contrast(1);
            }
            50% {
                filter: brightness(1.2) contrast(1.1);
            }
        }

        /* 移除旋转，只保留星光闪烁 */
        .svg-container svg {
            animation: starGlow 6s ease-in-out infinite;
            transform-origin: center;
        }

        /* 标题 */
        .title {
            display: none;
        }

        /* 返回按钮 */
        .back-button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="svg-container" id="svgContainer"></div>
        <div class="title">Starry Night</div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">返回相框</button>

    <script>
        // 加载并解析SVG
        fetch('DynamicStarrysky.svg')
            .then(response => response.text())
            .then(svgText => {
                const container = document.getElementById('svgContainer');
                container.innerHTML = svgText;

                // 等待SVG加载完成后添加聚焦效果样式
                setTimeout(() => {
                    const svg = container.querySelector('svg');
                    if (svg) {
                        // 创建或获取 <style> 元素
                        let styleElement = svg.querySelector('style');
                        if (!styleElement) {
                            styleElement = document.createElementNS('http://www.w3.org/2000/svg', 'style');
                            svg.insertBefore(styleElement, svg.firstChild);
                        }

                        // 添加聚焦效果的CSS
                        const focusStyles = `
                            /* 星空背景 - 稍微放大 */
                            #Sky\\ 1 {
                                transform: scale(1.15);
                                transform-origin: center;
                                transform-box: fill-box;
                            }

                            /* 塔 - 稍微放大，作为视觉焦点 */
                            #Tower\\ 1 {
                                transform: scale(1.25);
                                transform-origin: center;
                                transform-box: fill-box;
                            }

                            /* 村庄 - 稍微缩小 */
                            #Town\\ 1 {
                                transform: scale(0.85);
                                transform-origin: center;
                                transform-box: fill-box;
                            }
                        `;

                        styleElement.textContent += focusStyles;
                        console.log('✅ 聚焦效果已应用');
                    }
                }, 100);
            })
            .catch(error => {
                console.error('加载SVG失败:', error);
            });
    </script>
</body>
</html>
