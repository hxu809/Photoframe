<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态星空 - Dynamic Starry Sky</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            width: 100vw;
            background: #0a1628;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
        }

        /* SVG 容器 */
        .svg-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            animation: starGlow 6s ease-in-out infinite;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 星光闪烁效果 */
        @keyframes starGlow {
            0%, 100% {
                filter: brightness(1) contrast(1);
            }
            50% {
                filter: brightness(1.2) contrast(1.1);
            }
        }

        /* 移除旋转，只保留星光闪烁 */
        .svg-container svg {
            animation: starGlow 6s ease-in-out infinite;
            transform-origin: center;
        }

        /* 标题 */
        .title {
            display: none;
        }

        /* 返回按钮 */
        .back-button {
            display: none;
        }

        /* 视频叠加层 */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-overlay.show {
            display: flex;
            opacity: 1;
        }

        .video-overlay video {
            width: 1920px;
            height: 1080px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="svg-container" id="svgContainer"></div>
        <div class="title">Starry Night</div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">返回相框</button>

    <!-- 视频叠加层 -->
    <div id="videoOverlay" class="video-overlay">
        <video id="starryVideo" preload="auto" loop>
            <source src="starrysky.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        // 播放星空视频
        function playStarryVideo() {
            const videoOverlay = document.getElementById('videoOverlay');
            const starryVideo = document.getElementById('starryVideo');

            if (!videoOverlay || !starryVideo) {
                console.error('❌ 未找到视频元素');
                return;
            }

            console.log('🎬 开始播放星空视频');
            videoOverlay.classList.add('show');
            starryVideo.currentTime = 0;

            const playPromise = starryVideo.play();
            if (playPromise !== undefined) {
                playPromise
                    .then(() => console.log('✅ 视频开始循环播放'))
                    .catch(error => {
                        console.error('❌ 视频播放失败:', error);
                        videoOverlay.classList.remove('show');
                    });
            }
        }

        // 关闭视频
        function closeVideo() {
            const videoOverlay = document.getElementById('videoOverlay');
            const starryVideo = document.getElementById('starryVideo');

            if (videoOverlay && videoOverlay.classList.contains('show')) {
                videoOverlay.classList.remove('show');
                if (starryVideo) {
                    starryVideo.pause();
                }
                console.log('✅ 视频已关闭');
                return true;
            }
            return false;
        }

        // ESC键关闭视频或返回到上一级
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                // 如果视频正在播放，先关闭视频
                if (!closeVideo()) {
                    // 如果没有视频在播放，返回首页
                    window.location.href = 'index.html';
                }
            }
        });

        // 加载并解析SVG
        fetch('DynamicStarrysky.svg')
            .then(response => response.text())
            .then(svgText => {
                const container = document.getElementById('svgContainer');
                container.innerHTML = svgText;

                // 等待SVG加载完成后添加聚焦效果样式
                setTimeout(() => {
                    const svg = container.querySelector('svg');
                    if (svg) {
                        console.log('✅ SVG元素找到');

                        // 创建或获取 <style> 元素
                        let styleElement = svg.querySelector('style');
                        if (!styleElement) {
                            styleElement = document.createElementNS('http://www.w3.org/2000/svg', 'style');
                            svg.insertBefore(styleElement, svg.firstChild);
                            console.log('✅ 新建style元素');
                        } else {
                            console.log('✅ 使用现有style元素');
                        }

                        // 检查元素是否存在
                        const sky = svg.querySelector('[id="Sky 1"]');
                        const tower = svg.querySelector('[id="Tower 1"]');
                        const town = svg.querySelector('[id="Town 1"]');

                        console.log('元素检查:');
                        console.log('  Sky 1:', sky ? '✅ 找到' : '❌ 未找到');
                        console.log('  Tower 1:', tower ? '✅ 找到' : '❌ 未找到');
                        console.log('  Town 1:', town ? '✅ 找到' : '❌ 未找到');

                        // 添加聚焦效果的CSS - 使用属性选择器确保兼容性
                        const focusStyles = `
                            /* 星空背景 - 稍微放大 */
                            [id="Sky 1"] {
                                transform: scale(1.15);
                                transform-origin: center;
                                transform-box: fill-box;
                            }

                            /* 塔 - 稍微放大，作为视觉焦点 */
                            [id="Tower 1"] {
                                transform: scale(1.25);
                                transform-origin: center;
                                transform-box: fill-box;
                            }

                            /* 村庄 - 稍微缩小 */
                            [id="Town 1"] {
                                transform: scale(0.85);
                                transform-origin: center;
                                transform-box: fill-box;
                            }
                        `;

                        styleElement.textContent += focusStyles;
                        console.log('✅ 聚焦效果CSS已注入');
                        console.log('CSS长度:', styleElement.textContent.length, '字符');

                        // 验证CSS是否真的被应用
                        if (sky) {
                            const computedStyle = window.getComputedStyle(sky);
                            console.log('星空的transform:', computedStyle.transform);
                        }
                        if (tower) {
                            const computedStyle = window.getComputedStyle(tower);
                            console.log('塔的transform:', computedStyle.transform);
                        }

                        // SVG加载完成后，自动播放视频
                        console.log('🎬 准备自动播放星空视频');
                        setTimeout(() => {
                            playStarryVideo();
                        }, 300);
                    }
                }, 100);
            })
            .catch(error => {
                console.error('加载SVG失败:', error);
            });
    </script>
</body>
</html>
