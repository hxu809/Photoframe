<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- 深色木纹渐变 -->
    <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3e2723;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#5d4037;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>

    <!-- 浅色木纹渐变 -->
    <linearGradient id="lightWood" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#A1887F;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8D6E63;stop-opacity:1" />
    </linearGradient>

    <!-- 金色渐变 -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
        <stop offset="30%" style="stop-color:#FFA500;stop-opacity:1" />
        <stop offset="70%" style="stop-color:#FFD700;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
        <feOffset dx="6" dy="6" result="offsetblur"/>
        <feComponentTransfer>
            <feFuncA type="linear" slope="0.5"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- 浮雕效果 -->
    <filter id="bevel">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
        <feSpecularLighting surfaceScale="5" specularConstant="0.5" specularExponent="10" result="spec">
            <fePointLight x="-5000" y="-10000" z="20000"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec"/>
        <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
</defs>

<!-- 透明背景 -->
<rect width="1920" height="1080" fill="none"/>

<!-- 相框 - 画作开口保持 485,178,950×724 -->
<g id="PhotoFrame" filter="url(#shadow)">

    <!-- 主框架路径 - 更宽的边框 (120px宽度) -->
    <!-- 外边界: 265, 0, 1390×1080 -->
    <!-- 内边界: 395, 178, 1130×724 - 正好容纳950×724画作 -->
    <path d="
        M 265 0
        L 1655 0
        L 1655 1080
        L 265 1080
        Z
        M 395 178
        L 395 902
        L 1525 902
        L 1525 178
        Z
    " fill="url(#darkWood)" fill-rule="evenodd" stroke="#2c1810" stroke-width="4"/>

    <!-- 外层装饰金边 - 顶部 -->
    <rect x="285" y="20" width="1350" height="30" fill="url(#gold)" rx="3" filter="url(#bevel)"/>

    <!-- 外层装饰金边 - 底部 -->
    <rect x="285" y="1030" width="1350" height="30" fill="url(#gold)" rx="3" filter="url(#bevel)"/>

    <!-- 外层装饰金边 - 左侧 -->
    <rect x="285" y="20" width="30" height="1040" fill="url(#gold)" rx="3" filter="url(#bevel)"/>

    <!-- 外层装饰金边 - 右侧 -->
    <rect x="1605" y="20" width="30" height="1040" fill="url(#gold)" rx="3" filter="url(#bevel)"/>

    <!-- 中层木框 - 顶部 -->
    <rect x="335" y="70" width="1250" height="50" fill="url(#lightWood)" rx="2"/>

    <!-- 中层木框 - 底部 -->
    <rect x="335" y="960" width="1250" height="50" fill="url(#lightWood)" rx="2"/>

    <!-- 中层木框 - 左侧 -->
    <rect x="335" y="70" width="50" height="940" fill="url(#lightWood)" rx="2"/>

    <!-- 中层木框 - 右侧 -->
    <rect x="1535" y="70" width="50" height="940" fill="url(#lightWood)" rx="2"/>

    <!-- 内层金边 - 顶部 -->
    <rect x="450" y="143" width="1020" height="20" fill="url(#gold)" rx="2" filter="url(#bevel)"/>

    <!-- 内层金边 - 底部 -->
    <rect x="450" y="917" width="1020" height="20" fill="url(#gold)" rx="2" filter="url(#bevel)"/>

    <!-- 内层金边 - 左侧 -->
    <rect x="450" y="143" width="20" height="794" fill="url(#gold)" rx="2" filter="url(#bevel)"/>

    <!-- 内层金边 - 右侧 -->
    <rect x="1450" y="143" width="20" height="794" fill="url(#gold)" rx="2" filter="url(#bevel)"/>

    <!-- 画作开口内阴影 -->
    <rect x="395" y="178" width="1130" height="724"
          fill="none"
          stroke="rgba(0,0,0,0.5)"
          stroke-width="2"/>

    <!-- 四角装饰徽章 -->
    <!-- 左上角 -->
    <g transform="translate(300, 35)">
        <circle cx="0" cy="0" r="25" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="18" fill="url(#darkWood)"/>
        <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="4" fill="url(#darkWood)"/>
    </g>

    <!-- 右上角 -->
    <g transform="translate(1620, 35)">
        <circle cx="0" cy="0" r="25" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="18" fill="url(#darkWood)"/>
        <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="4" fill="url(#darkWood)"/>
    </g>

    <!-- 左下角 -->
    <g transform="translate(300, 1045)">
        <circle cx="0" cy="0" r="25" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="18" fill="url(#darkWood)"/>
        <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="4" fill="url(#darkWood)"/>
    </g>

    <!-- 右下角 -->
    <g transform="translate(1620, 1045)">
        <circle cx="0" cy="0" r="25" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="18" fill="url(#darkWood)"/>
        <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="4" fill="url(#darkWood)"/>
    </g>

    <!-- 顶部中央装饰牌 -->
    <rect x="920" y="25" width="80" height="70" fill="url(#gold)" rx="8" filter="url(#bevel)"/>
    <rect x="930" y="35" width="60" height="50" fill="url(#lightWood)" rx="5"/>
    <text x="960" y="70"
          font-family="Georgia, serif"
          font-size="24"
          font-weight="bold"
          fill="url(#gold)"
          text-anchor="middle">ART</text>

    <!-- 底部中央装饰牌 -->
    <rect x="920" y="985" width="80" height="70" fill="url(#gold)" rx="8" filter="url(#bevel)"/>
    <circle cx="960" cy="1020" r="20" fill="url(#lightWood)"/>
    <circle cx="960" cy="1020" r="14" fill="url(#gold)"/>
    <circle cx="960" cy="1020" r="8" fill="url(#darkWood)"/>

    <!-- 左侧中央装饰 -->
    <rect x="280" y="515" width="60" height="50" fill="url(#gold)" rx="5" filter="url(#bevel)"/>
    <circle cx="310" cy="540" r="15" fill="url(#lightWood)"/>
    <circle cx="310" cy="540" r="8" fill="url(#gold)"/>

    <!-- 右侧中央装饰 -->
    <rect x="1580" y="515" width="60" height="50" fill="url(#gold)" rx="5" filter="url(#bevel)"/>
    <circle cx="1610" cy="540" r="15" fill="url(#lightWood)"/>
    <circle cx="1610" cy="540" r="8" fill="url(#gold)"/>

</g>

<!-- 画作区域标记（不可见） -->
<rect id="ArtworkArea" x="395" y="178" width="1130" height="724" fill="none" opacity="0"/>

</svg>
