<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- 木纹渐变 -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#654321;stop-opacity:1" />
        <stop offset="30%" style="stop-color:#8B4513;stop-opacity:1" />
        <stop offset="70%" style="stop-color:#A0522D;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>

    <!-- 金色渐变 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="frameShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
        <feOffset dx="4" dy="4" result="offsetblur"/>
        <feComponentTransfer>
            <feFuncA type="linear" slope="0.4"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>

<!-- 透明背景 -->
<rect width="1920" height="1080" fill="none"/>

<!-- 相框 - 使用路径创建带开口的边框 -->
<g id="PhotoFrame" filter="url(#frameShadow)">

    <!-- 主相框路径 - 外框到内框的开口 -->
    <!-- 外边界: 345, 38, 1230×1004 -->
    <!-- 内边界(画作开口): 485, 178, 950×724 -->
    <path d="
        M 345 38
        L 1575 38
        L 1575 1042
        L 345 1042
        Z
        M 485 178
        L 485 902
        L 1435 902
        L 1435 178
        Z
    " fill="url(#woodGradient)" fill-rule="evenodd" stroke="#4a2511" stroke-width="3"/>

    <!-- 金色内边装饰条 - 顶部 -->
    <rect x="470" y="163" width="980" height="10" fill="url(#goldGradient)"/>

    <!-- 金色内边装饰条 - 底部 -->
    <rect x="470" y="907" width="980" height="10" fill="url(#goldGradient)"/>

    <!-- 金色内边装饰条 - 左侧 -->
    <rect x="470" y="163" width="10" height="754" fill="url(#goldGradient)"/>

    <!-- 金色内边装饰条 - 右侧 -->
    <rect x="1440" y="163" width="10" height="754" fill="url(#goldGradient)"/>

    <!-- 中间装饰带 - 顶部 -->
    <rect x="365" y="58" width="1190" height="25" fill="url(#goldGradient)" rx="2"/>

    <!-- 中间装饰带 - 底部 -->
    <rect x="365" y="997" width="1190" height="25" fill="url(#goldGradient)" rx="2"/>

    <!-- 中间装饰带 - 左侧 -->
    <rect x="365" y="58" width="25" height="964" fill="url(#goldGradient)" rx="2"/>

    <!-- 中间装饰带 - 右侧 -->
    <rect x="1530" y="58" width="25" height="964" fill="url(#goldGradient)" rx="2"/>

    <!-- 四角装饰 -->
    <!-- 左上 -->
    <g transform="translate(355, 48)">
        <circle cx="0" cy="0" r="18" fill="url(#goldGradient)"/>
        <circle cx="0" cy="0" r="12" fill="url(#woodGradient)"/>
        <circle cx="0" cy="0" r="6" fill="url(#goldGradient)"/>
    </g>

    <!-- 右上 -->
    <g transform="translate(1565, 48)">
        <circle cx="0" cy="0" r="18" fill="url(#goldGradient)"/>
        <circle cx="0" cy="0" r="12" fill="url(#woodGradient)"/>
        <circle cx="0" cy="0" r="6" fill="url(#goldGradient)"/>
    </g>

    <!-- 左下 -->
    <g transform="translate(355, 1032)">
        <circle cx="0" cy="0" r="18" fill="url(#goldGradient)"/>
        <circle cx="0" cy="0" r="12" fill="url(#woodGradient)"/>
        <circle cx="0" cy="0" r="6" fill="url(#goldGradient)"/>
    </g>

    <!-- 右下 -->
    <g transform="translate(1565, 1032)">
        <circle cx="0" cy="0" r="18" fill="url(#goldGradient)"/>
        <circle cx="0" cy="0" r="12" fill="url(#woodGradient)"/>
        <circle cx="0" cy="0" r="6" fill="url(#goldGradient)"/>
    </g>

    <!-- 顶部装饰牌 -->
    <rect x="935" y="43" width="50" height="50" fill="url(#goldGradient)" rx="5"/>
    <text x="960" y="75" font-family="Georgia, serif" font-size="20" font-weight="bold"
          fill="#654321" text-anchor="middle">ART</text>

    <!-- 底部装饰牌 -->
    <rect x="935" y="987" width="50" height="50" fill="url(#goldGradient)" rx="5"/>
    <circle cx="960" cy="1012" r="12" fill="url(#woodGradient)"/>
    <circle cx="960" cy="1012" r="6" fill="url(#goldGradient)"/>

    <!-- 内框阴影效果 -->
    <rect x="485" y="178" width="950" height="724"
          fill="none"
          stroke="rgba(0,0,0,0.4)"
          stroke-width="1"/>
</g>

<!-- 画作区域标记（不可见） -->
<rect id="ArtworkArea" x="485" y="178" width="950" height="724" fill="none" opacity="0"/>

<!-- 中心点（不可见） -->
<circle id="CenterPoint" cx="960" cy="540" r="3" fill="red" opacity="0"/>

</svg>
