<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- 木纹渐变 -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>

    <!-- 金色渐变 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="frameShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
        <feOffset dx="4" dy="4" result="offsetblur"/>
        <feComponentTransfer>
            <feFuncA type="linear" slope="0.3"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- 浮雕效果 -->
    <filter id="emboss">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.75"
                           specularExponent="20" lighting-color="#white" result="specOut">
            <fePointLight x="-5000" y="-10000" z="20000"/>
        </feSpecularLighting>
        <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
        <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic"
                    k1="0" k2="1" k3="1" k4="0"/>
    </filter>
</defs>

<!-- 透明背景 -->
<rect width="1920" height="1080" fill="none"/>

<!-- 相框主体 -->
<g id="PhotoFrame" filter="url(#frameShadow)">
    <!-- 外框 -->
    <rect x="385" y="78" width="1150" height="924"
          fill="url(#woodGradient)"
          stroke="#654321"
          stroke-width="3"
          rx="8" ry="8"/>

    <!-- 金色内边框 - 外层 -->
    <rect x="425" y="118" width="1070" height="844"
          fill="url(#goldGradient)"
          rx="4" ry="4"
          filter="url(#emboss)"/>

    <!-- 金色内边框 - 内层（立体效果） -->
    <rect x="435" y="128" width="1050" height="824"
          fill="#D4AF37"
          rx="3" ry="3"/>

    <!-- 木质中框 -->
    <rect x="445" y="138" width="1030" height="804"
          fill="url(#woodGradient)"
          rx="4" ry="4"/>

    <!-- 最内层金边 -->
    <rect x="475" y="168" width="970" height="744"
          fill="none"
          stroke="url(#goldGradient)"
          stroke-width="6"
          rx="2" ry="2"/>

    <!-- 装饰角 - 左上 -->
    <g transform="translate(395, 88)">
        <circle cx="20" cy="20" r="12" fill="#D4AF37"/>
        <circle cx="20" cy="20" r="8" fill="#8B4513"/>
        <circle cx="20" cy="20" r="4" fill="#D4AF37"/>
    </g>

    <!-- 装饰角 - 右上 -->
    <g transform="translate(1495, 88)">
        <circle cx="20" cy="20" r="12" fill="#D4AF37"/>
        <circle cx="20" cy="20" r="8" fill="#8B4513"/>
        <circle cx="20" cy="20" r="4" fill="#D4AF37"/>
    </g>

    <!-- 装饰角 - 左下 -->
    <g transform="translate(395, 972)">
        <circle cx="20" cy="20" r="12" fill="#D4AF37"/>
        <circle cx="20" cy="20" r="8" fill="#8B4513"/>
        <circle cx="20" cy="20" r="4" fill="#D4AF37"/>
    </g>

    <!-- 装饰角 - 右下 -->
    <g transform="translate(1495, 972)">
        <circle cx="20" cy="20" r="12" fill="#D4AF37"/>
        <circle cx="20" cy="20" r="8" fill="#8B4513"/>
        <circle cx="20" cy="20" r="4" fill="#D4AF37"/>
    </g>

    <!-- 顶部装饰线 -->
    <line x1="450" y1="103" x2="1470" y2="103"
          stroke="#D4AF37"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- 底部装饰线 -->
    <line x1="450" y1="977" x2="1470" y2="977"
          stroke="#D4AF37"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- 左侧装饰线 -->
    <line x1="410" y1="123" x2="410" y2="957"
          stroke="#D4AF37"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- 右侧装饰线 -->
    <line x1="1510" y1="123" x2="1510" y2="957"
          stroke="#D4AF37"
          stroke-width="2"
          stroke-linecap="round"/>
</g>

<!-- 画作放置区域标记（用于对齐，可以设为透明） -->
<rect id="ArtworkArea" x="485" y="178" width="950" height="724" fill="none" opacity="0"/>

<!-- 中心点标记（调试用，可以隐藏） -->
<circle id="CenterPoint" cx="960" cy="540" r="5" fill="red" opacity="0"/>

</svg>
