<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态毕加索 - Dynamic Picasso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c2c2c;
            overflow: hidden;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* SVG 容器 */
        .svg-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 立体主义分裂效果 */
        .svg-container svg {
            animation: cubismShift 8s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes cubismShift {
            0%, 100% {
                filter: hue-rotate(0deg) contrast(1);
                transform: scale(1);
            }
            25% {
                filter: hue-rotate(5deg) contrast(1.1);
                transform: scale(1.02);
            }
            50% {
                filter: hue-rotate(10deg) contrast(1.15);
                transform: scale(1.03);
            }
            75% {
                filter: hue-rotate(5deg) contrast(1.1);
                transform: scale(1.02);
            }
        }

        /* 标题 */
        .title {
            display: none;
        }

        /* 返回按钮 */
        .back-button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="svg-container" id="svgContainer"></div>
        <div class="title">CUBISM ART</div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">返回相框</button>

    <script>
        // 加载并解析SVG
        fetch('DynamicPicasso.svg')
            .then(response => response.text())
            .then(svgText => {
                document.getElementById('svgContainer').innerHTML = svgText;
            })
            .catch(error => {
                console.error('加载SVG失败:', error);
            });
    </script>
</body>
</html>
