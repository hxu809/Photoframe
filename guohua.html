<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态国画 - Dynamic Guohua</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5dc;
            overflow: hidden;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* SVG 容器 */
        .svg-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            animation: fadeIn 2s ease-in;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 整体淡入动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 添加水墨扩散效果 */
        .svg-container svg {
            filter: contrast(1.1) brightness(1.05);
            animation: inkFlow 8s ease-in-out infinite;
        }

        @keyframes inkFlow {
            0%, 100% {
                filter: contrast(1.1) brightness(1.05);
            }
            50% {
                filter: contrast(1.15) brightness(1.1);
            }
        }

        /* 标题 */
        .title {
            position: absolute;
            top: 40px;
            right: 60px;
            color: #2c3e50;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            font-family: 'STKaiti', 'KaiTi', serif;
            letter-spacing: 12px;
            writing-mode: vertical-rl;
            animation: titleFade 3s ease-in;
        }

        @keyframes titleFade {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #8b7355;
            border-radius: 25px;
            color: #2c3e50;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'STKaiti', 'KaiTi', serif;
            z-index: 10;
        }

        .back-button:hover {
            background: rgba(139, 115, 85, 0.9);
            color: white;
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="svg-container" id="svgContainer"></div>
        <div class="title">山水意境</div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">返回相框</button>

    <script>
        // 加载并解析SVG
        fetch('DynamicGuohua.svg')
            .then(response => response.text())
            .then(svgText => {
                document.getElementById('svgContainer').innerHTML = svgText;
            })
            .catch(error => {
                console.error('加载SVG失败:', error);
            });
    </script>
</body>
</html>
