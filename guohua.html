<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态国画 - Dynamic Guohua</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5dc;
            overflow: hidden;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* SVG 容器 */
        .svg-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            animation: fadeIn 2s ease-in;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 整体淡入动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 鸟的动画 - 轻微上下浮动和翅膀扇动效果 */
        #Bird1\\ 1 {
            animation: birdFloat 3s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes birdFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-8px) rotate(-1deg);
            }
            50% {
                transform: translateY(-12px) rotate(0deg);
            }
            75% {
                transform: translateY(-8px) rotate(1deg);
            }
        }

        /* 花朵1 - 跟随鸟的动作轻微摇摆 */
        #Flower1\\ 1 {
            animation: flowerSway1 3s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes flowerSway1 {
            0%, 100% {
                transform: rotate(0deg) translateY(0);
            }
            25% {
                transform: rotate(1deg) translateY(-2px);
            }
            50% {
                transform: rotate(2deg) translateY(-3px);
            }
            75% {
                transform: rotate(1deg) translateY(-2px);
            }
        }

        /* 花朵2 - 稍微不同的节奏 */
        #Flower2\\ 1 {
            animation: flowerSway2 3.5s ease-in-out infinite 0.5s;
            transform-origin: bottom center;
        }

        @keyframes flowerSway2 {
            0%, 100% {
                transform: rotate(0deg) translateX(0);
            }
            25% {
                transform: rotate(-1.5deg) translateX(-2px);
            }
            50% {
                transform: rotate(-3deg) translateX(-4px);
            }
            75% {
                transform: rotate(-1.5deg) translateX(-2px);
            }
        }

        /* 花朵3 - 更轻柔的摇摆 */
        #Flower3\\ 1 {
            animation: flowerSway3 4s ease-in-out infinite 0.8s;
            transform-origin: bottom center;
        }

        @keyframes flowerSway3 {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(1.5deg) scale(1.01);
            }
            50% {
                transform: rotate(3deg) scale(1.02);
            }
            75% {
                transform: rotate(1.5deg) scale(1.01);
            }
        }

        /* 树枝保持静止 - 不添加动画 */
        #Branch1\\ 1 {
            /* 无动画，保持静止 */
        }

        /* 添加水墨扩散效果 */
        .svg-container svg {
            filter: contrast(1.1) brightness(1.05);
            animation: inkFlow 8s ease-in-out infinite;
        }

        @keyframes inkFlow {
            0%, 100% {
                filter: contrast(1.1) brightness(1.05);
            }
            50% {
                filter: contrast(1.15) brightness(1.1);
            }
        }

        /* 标题 */
        .title {
            display: none;
        }

        /* 返回按钮 */
        .back-button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="svg-container" id="svgContainer"></div>
        <div class="title">山水意境</div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">返回相框</button>

    <script>
        // ESC键返回到上一级
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                window.location.href = 'index.html';
            }
        });

        // 加载并解析SVG
        fetch('DynamicGuohua.svg')
            .then(response => response.text())
            .then(svgText => {
                document.getElementById('svgContainer').innerHTML = svgText;
            })
            .catch(error => {
                console.error('加载SVG失败:', error);
            });
    </script>
</body>
</html>
