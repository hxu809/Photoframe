<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态国画 - Dynamic Guohua</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            width: 100vw;
            background: #f5f5dc;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
        }

        /* SVG 容器 */
        .svg-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            animation: fadeIn 2s ease-in;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 整体淡入动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 鸟的动画 - 轻微上下浮动和翅膀扇动效果 */
        #Bird1\\ 1 {
            animation: birdFloat 3s ease-in-out infinite;
            transform-origin: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @keyframes birdFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-8px) rotate(-1deg);
            }
            50% {
                transform: translateY(-12px) rotate(0deg);
            }
            75% {
                transform: translateY(-8px) rotate(1deg);
            }
        }

        /* 鼠标悬停时的翻转动画 */
        #Bird1\\ 1.flipped {
            animation: birdFloatFlipped 3s ease-in-out infinite;
        }

        @keyframes birdFloatFlipped {
            0%, 100% {
                transform: scaleX(-1) translateY(0) rotate(0deg);
            }
            25% {
                transform: scaleX(-1) translateY(-8px) rotate(1deg);
            }
            50% {
                transform: scaleX(-1) translateY(-12px) rotate(0deg);
            }
            75% {
                transform: scaleX(-1) translateY(-8px) rotate(-1deg);
            }
        }

        /* 鼠标悬停时的跳动动画 */
        #Bird1\\ 1.hopping {
            animation: birdHop 0.6s ease-in-out;
        }

        @keyframes birdHop {
            0%, 100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-30px) scaleY(1.1);
            }
            50% {
                transform: translateY(-40px) scaleY(1.15);
            }
            75% {
                transform: translateY(-20px) scaleY(1.05);
            }
        }

        /* 点击动画 */
        #Bird1\\ 1.clicking {
            animation: birdClick 0.5s ease-in-out;
        }

        @keyframes birdClick {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1.2) rotate(-5deg) translateY(-20px);
            }
            50% {
                transform: scale(1.15) rotate(5deg) translateY(-30px);
            }
            75% {
                transform: scale(1.1) rotate(-3deg) translateY(-15px);
            }
        }

        /* 花朵1 - 跟随鸟的动作轻微摇摆 */
        #Flower1\\ 1 {
            animation: flowerSway1 3s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes flowerSway1 {
            0%, 100% {
                transform: rotate(0deg) translateY(0);
            }
            25% {
                transform: rotate(1deg) translateY(-2px);
            }
            50% {
                transform: rotate(2deg) translateY(-3px);
            }
            75% {
                transform: rotate(1deg) translateY(-2px);
            }
        }

        /* 花朵2 - 稍微不同的节奏 */
        #Flower2\\ 1 {
            animation: flowerSway2 3.5s ease-in-out infinite 0.5s;
            transform-origin: bottom center;
        }

        @keyframes flowerSway2 {
            0%, 100% {
                transform: rotate(0deg) translateX(0);
            }
            25% {
                transform: rotate(-1.5deg) translateX(-2px);
            }
            50% {
                transform: rotate(-3deg) translateX(-4px);
            }
            75% {
                transform: rotate(-1.5deg) translateX(-2px);
            }
        }

        /* 花朵3 - 更轻柔的摇摆 */
        #Flower3\\ 1 {
            animation: flowerSway3 4s ease-in-out infinite 0.8s;
            transform-origin: bottom center;
        }

        @keyframes flowerSway3 {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(1.5deg) scale(1.01);
            }
            50% {
                transform: rotate(3deg) scale(1.02);
            }
            75% {
                transform: rotate(1.5deg) scale(1.01);
            }
        }

        /* 树枝保持静止 - 不添加动画 */
        #Branch1\\ 1 {
            /* 无动画，保持静止 */
        }

        /* 添加水墨扩散效果 */
        .svg-container svg {
            filter: contrast(1.1) brightness(1.05);
            animation: inkFlow 8s ease-in-out infinite;
        }

        @keyframes inkFlow {
            0%, 100% {
                filter: contrast(1.1) brightness(1.05);
            }
            50% {
                filter: contrast(1.15) brightness(1.1);
            }
        }

        /* 标题 */
        .title {
            display: none;
        }

        /* 返回按钮 */
        .back-button {
            display: none;
        }

        /* 视频覆盖层 */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .video-overlay.show {
            display: flex;
            opacity: 1;
        }

        .video-overlay video {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="svg-container" id="svgContainer"></div>
        <div class="title">山水意境</div>
    </div>

    <!-- 视频覆盖层 -->
    <div class="video-overlay" id="videoOverlay">
        <video id="birdVideo" preload="auto" playsinline webkit-playsinline>
            <source src="Guohua.mp4" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">返回相框</button>

    <script>
        // 创建 Web Audio API 上下文
        let audioContext = null;

        // 生成鸟叫声
        function playBirdSound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const now = audioContext.currentTime;

            // 创建一个短促的鸟叫声效果（像小鸟鸣叫）
            // 使用两个音调的快速变化来模拟鸟叫

            // 第一个音符（高音）
            const oscillator1 = audioContext.createOscillator();
            const gainNode1 = audioContext.createGain();

            oscillator1.connect(gainNode1);
            gainNode1.connect(audioContext.destination);

            oscillator1.type = 'sine';
            oscillator1.frequency.setValueAtTime(1200, now);
            oscillator1.frequency.exponentialRampToValueAtTime(1800, now + 0.05);
            oscillator1.frequency.exponentialRampToValueAtTime(1400, now + 0.1);

            gainNode1.gain.setValueAtTime(0.3, now);
            gainNode1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

            oscillator1.start(now);
            oscillator1.stop(now + 0.15);

            // 第二个音符（稍低，稍后）
            const oscillator2 = audioContext.createOscillator();
            const gainNode2 = audioContext.createGain();

            oscillator2.connect(gainNode2);
            gainNode2.connect(audioContext.destination);

            oscillator2.type = 'sine';
            oscillator2.frequency.setValueAtTime(1000, now + 0.15);
            oscillator2.frequency.exponentialRampToValueAtTime(1500, now + 0.2);
            oscillator2.frequency.exponentialRampToValueAtTime(1100, now + 0.25);

            gainNode2.gain.setValueAtTime(0.25, now + 0.15);
            gainNode2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            oscillator2.start(now + 0.15);
            oscillator2.stop(now + 0.3);

            console.log('🐦 鸟叫声播放');
        }

        // 播放小鸟飞走视频
        function playBirdVideo() {
            const videoOverlay = document.getElementById('videoOverlay');
            const birdVideo = document.getElementById('birdVideo');

            if (!videoOverlay || !birdVideo) {
                console.error('❌ 未找到视频元素');
                alert('未找到视频元素');
                return;
            }

            console.log('🎬 准备播放视频');
            console.log('视频路径:', birdVideo.querySelector('source').src);
            console.log('视频就绪状态:', birdVideo.readyState);

            // 显示视频覆盖层
            videoOverlay.classList.add('show');

            // 重置视频
            birdVideo.currentTime = 0;

            // 尝试播放视频
            const playPromise = birdVideo.play();

            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        console.log('✅ 视频开始播放');
                    })
                    .catch(error => {
                        console.error('❌ 视频播放失败:', error);
                        console.error('错误类型:', error.name);
                        console.error('错误信息:', error.message);
                        alert('视频播放失败: ' + error.message);
                        videoOverlay.classList.remove('show');
                    });
            }

            // 视频加载错误处理
            birdVideo.onerror = (e) => {
                console.error('❌ 视频加载错误:', e);
                console.error('错误代码:', birdVideo.error ? birdVideo.error.code : 'unknown');
                console.error('错误信息:', birdVideo.error ? birdVideo.error.message : 'unknown');
                alert('视频加载失败');
                videoOverlay.classList.remove('show');
            };

            // 视频播放结束后隐藏覆盖层
            birdVideo.onended = () => {
                videoOverlay.classList.remove('show');
                console.log('🎬 视频播放结束');
            };

            // 点击视频区域可以关闭视频
            videoOverlay.onclick = (e) => {
                if (e.target === videoOverlay) {
                    birdVideo.pause();
                    videoOverlay.classList.remove('show');
                    console.log('🎬 用户关闭视频');
                }
            };
        }

        // ESC键返回到上一级
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                // 如果视频正在播放，先关闭视频
                const videoOverlay = document.getElementById('videoOverlay');
                const birdVideo = document.getElementById('birdVideo');

                if (videoOverlay && videoOverlay.classList.contains('show')) {
                    birdVideo.pause();
                    videoOverlay.classList.remove('show');
                } else {
                    // 否则返回首页
                    window.location.href = 'index.html';
                }
            }
        });

        // 加载并解析SVG
        fetch('DynamicGuohua.svg')
            .then(response => response.text())
            .then(svgText => {
                const container = document.getElementById('svgContainer');
                container.innerHTML = svgText;

                // SVG加载完成后，注入CSS动画和添加交互功能
                setTimeout(() => {
                    const svg = container.querySelector('svg');

                    if (svg) {
                        console.log('✅ SVG元素找到');

                        // 创建或获取 <style> 元素
                        let styleElement = svg.querySelector('style');
                        if (!styleElement) {
                            styleElement = document.createElementNS('http://www.w3.org/2000/svg', 'style');
                            svg.insertBefore(styleElement, svg.firstChild);
                            console.log('✅ 新建style元素');
                        } else {
                            console.log('✅ 使用现有style元素');
                        }

                        // 检查元素是否存在
                        const bird = svg.querySelector('#Bird11');
                        const flower1 = svg.querySelector('#Flower11');
                        const flower2 = svg.querySelector('#Flower21');
                        const flower3 = svg.querySelector('#Flower31');

                        console.log('元素检查:');
                        console.log('  Bird11:', bird ? '✅ 找到' : '❌ 未找到');
                        console.log('  Flower11:', flower1 ? '✅ 找到' : '❌ 未找到');
                        console.log('  Flower21:', flower2 ? '✅ 找到' : '❌ 未找到');
                        console.log('  Flower31:', flower3 ? '✅ 找到' : '❌ 未找到');

                        // 注入所有动画CSS
                        const animationStyles = `
                            /* 树枝 - 保持静止，但允许鼠标事件穿透 */
                            #Branch1\\ 1 {
                                pointer-events: none !important;
                            }

                            /* 鸟的动画 - 轻微上下浮动和翅膀扇动效果 */
                            #Bird11 {
                                animation: birdFloat 3s ease-in-out infinite;
                                transform-origin: center;
                                transform-box: fill-box;
                                cursor: pointer !important;
                                pointer-events: all !important;
                                transition: transform 0.3s ease;
                            }

                            @keyframes birdFloat {
                                0%, 100% {
                                    transform: translateY(0) rotate(0deg);
                                }
                                25% {
                                    transform: translateY(-8px) rotate(-1deg);
                                }
                                50% {
                                    transform: translateY(-12px) rotate(0deg);
                                }
                                75% {
                                    transform: translateY(-8px) rotate(1deg);
                                }
                            }

                            /* 鼠标悬停时的翻转动画 */
                            #Bird11.flipped {
                                animation: birdFloatFlipped 3s ease-in-out infinite;
                            }

                            @keyframes birdFloatFlipped {
                                0%, 100% {
                                    transform: scaleX(-1) translateY(0) rotate(0deg);
                                }
                                25% {
                                    transform: scaleX(-1) translateY(-8px) rotate(1deg);
                                }
                                50% {
                                    transform: scaleX(-1) translateY(-12px) rotate(0deg);
                                }
                                75% {
                                    transform: scaleX(-1) translateY(-8px) rotate(-1deg);
                                }
                            }

                            /* 鼠标悬停时的跳动动画 */
                            #Bird11.hopping {
                                animation: birdHop 0.6s ease-in-out;
                            }

                            @keyframes birdHop {
                                0%, 100% {
                                    transform: translateY(0);
                                }
                                25% {
                                    transform: translateY(-30px) scaleY(1.1);
                                }
                                50% {
                                    transform: translateY(-40px) scaleY(1.15);
                                }
                                75% {
                                    transform: translateY(-20px) scaleY(1.05);
                                }
                            }

                            /* 点击动画 */
                            #Bird11.clicking {
                                animation: birdClick 0.5s ease-in-out;
                            }

                            @keyframes birdClick {
                                0%, 100% {
                                    transform: scale(1) rotate(0deg);
                                }
                                25% {
                                    transform: scale(1.2) rotate(-5deg) translateY(-20px);
                                }
                                50% {
                                    transform: scale(1.15) rotate(5deg) translateY(-30px);
                                }
                                75% {
                                    transform: scale(1.1) rotate(-3deg) translateY(-15px);
                                }
                            }

                            /* 花朵动画 */
                            #Flower11 {
                                animation: flowerSway1 3s ease-in-out infinite;
                                transform-origin: bottom center;
                                transform-box: fill-box;
                            }

                            @keyframes flowerSway1 {
                                0%, 100% {
                                    transform: rotate(0deg) translateY(0);
                                }
                                25% {
                                    transform: rotate(1deg) translateY(-2px);
                                }
                                50% {
                                    transform: rotate(2deg) translateY(-3px);
                                }
                                75% {
                                    transform: rotate(1deg) translateY(-2px);
                                }
                            }

                            #Flower21 {
                                animation: flowerSway2 3.5s ease-in-out infinite 0.5s;
                                transform-origin: bottom center;
                                transform-box: fill-box;
                            }

                            @keyframes flowerSway2 {
                                0%, 100% {
                                    transform: rotate(0deg) translateX(0);
                                }
                                25% {
                                    transform: rotate(-1.5deg) translateX(-2px);
                                }
                                50% {
                                    transform: rotate(-3deg) translateX(-4px);
                                }
                                75% {
                                    transform: rotate(-1.5deg) translateX(-2px);
                                }
                            }

                            #Flower31 {
                                animation: flowerSway3 4s ease-in-out infinite 0.8s;
                                transform-origin: bottom center;
                                transform-box: fill-box;
                            }

                            @keyframes flowerSway3 {
                                0%, 100% {
                                    transform: rotate(0deg) scale(1);
                                }
                                25% {
                                    transform: rotate(1.5deg) scale(1.01);
                                }
                                50% {
                                    transform: rotate(3deg) scale(1.02);
                                }
                                75% {
                                    transform: rotate(1.5deg) scale(1.01);
                                }
                            }
                        `;

                        styleElement.textContent += animationStyles;
                        console.log('✅ 国画动画CSS已注入到SVG');
                        console.log('CSS长度:', styleElement.textContent.length, '字符');

                        // 验证CSS是否真的被应用
                        if (bird) {
                            const computedStyle = window.getComputedStyle(bird);
                            console.log('鸟的动画:', computedStyle.animation);
                            console.log('鸟的cursor:', computedStyle.cursor);
                        }
                    }

                    // 在SVG容器内查找小鸟元素
                    const bird = container.querySelector('#Bird11');
                    console.log('查找Bird11小鸟元素:', bird ? '✅ 找到' : '❌ 未找到');

                    if (bird) {
                        let isFlipped = false;
                        let isHopping = false;

                        console.log('小鸟元素详情:');
                        console.log('  标签名:', bird.tagName);
                        console.log('  ID:', bird.getAttribute('id'));
                        console.log('  Cursor样式:', window.getComputedStyle(bird).cursor);

                        // 鼠标进入小鸟区域
                        bird.addEventListener('mouseenter', () => {
                            // 水平翻转
                            isFlipped = true;
                            bird.classList.add('flipped');

                            // 跳动
                            if (!isHopping) {
                                isHopping = true;
                                bird.classList.add('hopping');

                                setTimeout(() => {
                                    bird.classList.remove('hopping');
                                    isHopping = false;
                                }, 600);
                            }

                            console.log('🐦 鼠标进入鸟的区域 - 翻转并跳动');
                        });

                        // 鼠标离开小鸟区域
                        bird.addEventListener('mouseleave', () => {
                            // 恢复原状
                            isFlipped = false;
                            bird.classList.remove('flipped');
                            console.log('🐦 鼠标离开鸟的区域 - 恢复原状');
                        });

                        // 点击小鸟
                        bird.addEventListener('click', () => {
                            // 播放鸟叫声
                            playBirdSound();

                            // 添加点击动画
                            bird.classList.add('clicking');

                            setTimeout(() => {
                                bird.classList.remove('clicking');
                            }, 500);

                            // 播放小鸟飞走视频
                            playBirdVideo();

                            console.log('🐦 点击小鸟 - 播放飞走视频');
                        });

                        console.log('✅ 小鸟交互功能已激活');
                    } else {
                        console.warn('⚠️ 未找到小鸟元素');
                    }
                }, 100);
            })
            .catch(error => {
                console.error('加载SVG失败:', error);
            });
    </script>
</body>
</html>
