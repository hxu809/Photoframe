<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interactive 3D Cardboard Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }

        /* Canvas container - initially visible */
        #canvas-container {
            width: 100%;
            height: 100%;
            transition: opacity 1.5s ease-out;
        }

        #canvas-container.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Photo frame page - initially hidden */
        #frame-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in;
            z-index: 10;
        }

        #frame-page.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* This will be replaced with your actual photo frame page */
        #frame-page iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Signature overlay */
        #signature-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #signature-overlay.active {
            display: flex;
        }

        #signature-dialog {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        #signature-dialog h2 {
            margin: 0 0 20px 0;
            color: #333;
            text-align: center;
        }

        #signature-canvas {
            width: 100%;
            height: 200px;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: crosshair;
            background: white;
            touch-action: none;
        }

        #signature-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #signature-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #clear-btn {
            background: #f44336;
            color: white;
        }

        #clear-btn:hover {
            background: #d32f2f;
        }

        #confirm-btn {
            background: #4CAF50;
            color: white;
        }

        #confirm-btn:hover {
            background: #45a049;
        }

        /* Loading indicator */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Photo Frame Page (will load index.html) -->
    <div id="frame-page">
        <iframe src="index.html"></iframe>
    </div>

    <!-- Signature overlay -->
    <div id="signature-overlay">
        <div id="signature-dialog">
            <h2>Sign the Delivery</h2>
            <canvas id="signature-canvas"></canvas>
            <div id="signature-buttons">
                <button id="clear-btn">Clear</button>
                <button id="confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        let scene, camera, renderer, controls;
        let boxBody, boxFlaps = [];
        let labelMesh;
        let insideLight;
        let raycaster, mouse;
        let particles = [];

        // State management
        let state = "labelAttached"; // labelAttached, signing, labelRemoved, boxShaking, boxOpened, transitioned
        let boxClickCount = 0;
        const CLICKS_TO_OPEN = 3;
        let hasTransitioned = false; // Ensure transition only happens once

        // Click detection
        let mouseDownPos = { x: 0, y: 0 };
        let isDragging = false;
        const DRAG_THRESHOLD = 5;

        // Signature canvas
        let signatureCanvas, signatureCtx;
        let isDrawing = false;

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);
            scene.fog = new THREE.Fog(0x2a2a2a, 10, 50);

            // Setup camera
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(5, 4, 8);

            // Setup renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Setup controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 20;
            controls.maxPolarAngle = Math.PI / 2;

            // Setup raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Add lights
            setupLights();

            // Create 3D objects
            createBox();
            createLabel();
            createFloor();

            // Setup signature canvas
            setupSignatureCanvas();

            // Event listeners
            setupEventListeners();

            // Hide loading
            document.getElementById('loading').style.display = 'none';

            // Start animation loop
            animate();
        }

        // ============================================
        // LIGHTING
        // ============================================
        function setupLights() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // Main directional light
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            scene.add(dirLight);

            // Fill light
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            // Inside light (golden glow, initially off)
            insideLight = new THREE.PointLight(0xffd700, 0, 5);
            insideLight.position.set(0, 1, 0);
            scene.add(insideLight);
        }

        // ============================================
        // BOX CREATION (with separate flaps)
        // ============================================
        function createBox() {
            const boxSize = 2;
            const flapSize = 0.9;
            const flapThickness = 0.05;

            // Cardboard material
            const cardboardMaterial = new THREE.MeshStandardMaterial({
                color: 0xc9a96e,
                roughness: 0.9,
                metalness: 0.1
            });

            // Main box body (5 sides: bottom, front, back, left, right)
            const boxGroup = new THREE.Group();

            // Bottom
            const bottom = new THREE.Mesh(
                new THREE.BoxGeometry(boxSize, flapThickness, boxSize),
                cardboardMaterial
            );
            bottom.position.y = flapThickness / 2;
            bottom.castShadow = true;
            bottom.receiveShadow = true;
            boxGroup.add(bottom);

            // Front
            const front = new THREE.Mesh(
                new THREE.BoxGeometry(boxSize, boxSize, flapThickness),
                cardboardMaterial
            );
            front.position.set(0, boxSize / 2 + flapThickness, boxSize / 2);
            front.castShadow = true;
            front.receiveShadow = true;
            boxGroup.add(front);

            // Back
            const back = new THREE.Mesh(
                new THREE.BoxGeometry(boxSize, boxSize, flapThickness),
                cardboardMaterial
            );
            back.position.set(0, boxSize / 2 + flapThickness, -boxSize / 2);
            back.castShadow = true;
            back.receiveShadow = true;
            boxGroup.add(back);

            // Left
            const left = new THREE.Mesh(
                new THREE.BoxGeometry(flapThickness, boxSize, boxSize),
                cardboardMaterial
            );
            left.position.set(-boxSize / 2, boxSize / 2 + flapThickness, 0);
            left.castShadow = true;
            left.receiveShadow = true;
            boxGroup.add(left);

            // Right
            const right = new THREE.Mesh(
                new THREE.BoxGeometry(flapThickness, boxSize, boxSize),
                cardboardMaterial
            );
            right.position.set(boxSize / 2, boxSize / 2 + flapThickness, 0);
            right.castShadow = true;
            right.receiveShadow = true;
            boxGroup.add(right);

            // Create 4 top flaps (that can open)
            // Front flap
            const flapFront = new THREE.Mesh(
                new THREE.BoxGeometry(boxSize, flapThickness, flapSize),
                cardboardMaterial
            );
            flapFront.position.set(0, boxSize + flapThickness, flapSize / 2);
            flapFront.userData.pivot = new THREE.Vector3(0, boxSize + flapThickness, 0);
            flapFront.userData.axis = 'x';
            flapFront.castShadow = true;
            boxGroup.add(flapFront);
            boxFlaps.push(flapFront);

            // Back flap
            const flapBack = new THREE.Mesh(
                new THREE.BoxGeometry(boxSize, flapThickness, flapSize),
                cardboardMaterial
            );
            flapBack.position.set(0, boxSize + flapThickness, -flapSize / 2);
            flapBack.userData.pivot = new THREE.Vector3(0, boxSize + flapThickness, 0);
            flapBack.userData.axis = 'x';
            flapBack.castShadow = true;
            boxGroup.add(flapBack);
            boxFlaps.push(flapBack);

            // Left flap
            const flapLeft = new THREE.Mesh(
                new THREE.BoxGeometry(flapSize, flapThickness, boxSize),
                cardboardMaterial
            );
            flapLeft.position.set(-flapSize / 2, boxSize + flapThickness, 0);
            flapLeft.userData.pivot = new THREE.Vector3(0, boxSize + flapThickness, 0);
            flapLeft.userData.axis = 'z';
            flapLeft.castShadow = true;
            boxGroup.add(flapLeft);
            boxFlaps.push(flapLeft);

            // Right flap
            const flapRight = new THREE.Mesh(
                new THREE.BoxGeometry(flapSize, flapThickness, boxSize),
                cardboardMaterial
            );
            flapRight.position.set(flapSize / 2, boxSize + flapThickness, 0);
            flapRight.userData.pivot = new THREE.Vector3(0, boxSize + flapThickness, 0);
            flapRight.userData.axis = 'z';
            flapRight.castShadow = true;
            boxGroup.add(flapRight);
            boxFlaps.push(flapRight);

            boxBody = boxGroup;
            boxBody.userData.isBox = true;
            scene.add(boxBody);
        }

        // ============================================
        // LABEL CREATION (Using Expresswaybill.svg)
        // ============================================
        function createLabel() {
            const textureLoader = new THREE.TextureLoader();

            // Load Expresswaybill.svg texture (with fallback)
            const labelTexture = textureLoader.load(
                'Expresswaybill.svg',
                // Success callback
                undefined,
                // Progress callback
                undefined,
                // Error callback - create a simple fallback texture
                () => {
                    console.warn('Expresswaybill.svg not found, using fallback');
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 512, 256);
                    ctx.fillStyle = '#333333';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('EXPRESS WAYBILL', 256, 100);
                    ctx.font = '24px Arial';
                    ctx.fillText('Click to sign', 256, 150);
                    const texture = new THREE.CanvasTexture(canvas);
                    labelMesh.material.map = texture;
                    labelMesh.material.needsUpdate = true;
                }
            );

            const labelGeometry = new THREE.PlaneGeometry(1.5, 0.75);
            const labelMaterial = new THREE.MeshBasicMaterial({
                map: labelTexture,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 1
            });

            labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);
            labelMesh.position.set(0, 2.1, 0);
            labelMesh.rotation.x = -Math.PI / 2;
            labelMesh.userData.isLabel = true;
            scene.add(labelMesh);
        }

        // ============================================
        // FLOOR
        // ============================================
        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x404040,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        // ============================================
        // SIGNATURE CANVAS SETUP
        // ============================================
        function setupSignatureCanvas() {
            signatureCanvas = document.getElementById('signature-canvas');
            const rect = signatureCanvas.getBoundingClientRect();
            signatureCanvas.width = rect.width * window.devicePixelRatio;
            signatureCanvas.height = rect.height * window.devicePixelRatio;
            signatureCtx = signatureCanvas.getContext('2d');
            signatureCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
            signatureCtx.lineWidth = 2;
            signatureCtx.lineCap = 'round';
            signatureCtx.strokeStyle = '#000';

            // Clear button
            document.getElementById('clear-btn').addEventListener('click', () => {
                signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
            });

            // Confirm button
            document.getElementById('confirm-btn').addEventListener('click', () => {
                closeSignatureOverlay();
                tearOffLabel();
            });

            // Drawing on signature canvas
            signatureCanvas.addEventListener('mousedown', startSignature);
            signatureCanvas.addEventListener('mousemove', drawSignature);
            signatureCanvas.addEventListener('mouseup', endSignature);
            signatureCanvas.addEventListener('touchstart', startSignature);
            signatureCanvas.addEventListener('touchmove', drawSignature);
            signatureCanvas.addEventListener('touchend', endSignature);
        }

        function startSignature(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getSignaturePos(e);
            signatureCtx.beginPath();
            signatureCtx.moveTo(pos.x, pos.y);
        }

        function drawSignature(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const pos = getSignaturePos(e);
            signatureCtx.lineTo(pos.x, pos.y);
            signatureCtx.stroke();
        }

        function endSignature(e) {
            e.preventDefault();
            isDrawing = false;
        }

        function getSignaturePos(e) {
            const rect = signatureCanvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: (touch.clientX - rect.left) * (signatureCanvas.width / rect.width) / window.devicePixelRatio,
                y: (touch.clientY - rect.top) * (signatureCanvas.height / rect.height) / window.devicePixelRatio
            };
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Mouse events
            renderer.domElement.addEventListener('mousedown', onPointerDown);
            renderer.domElement.addEventListener('mousemove', onPointerMove);
            renderer.domElement.addEventListener('mouseup', onPointerUp);

            // Touch events
            renderer.domElement.addEventListener('touchstart', onPointerDown);
            renderer.domElement.addEventListener('touchmove', onPointerMove);
            renderer.domElement.addEventListener('touchend', onPointerUp);

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function onPointerDown(e) {
            const pos = getMousePosition(e);
            mouseDownPos = { x: pos.x, y: pos.y };
            isDragging = false;
        }

        function onPointerMove(e) {
            const pos = getMousePosition(e);
            const distance = Math.sqrt(
                Math.pow(pos.x - mouseDownPos.x, 2) +
                Math.pow(pos.y - mouseDownPos.y, 2)
            );
            if (distance > DRAG_THRESHOLD) {
                isDragging = true;
            }
        }

        function onPointerUp(e) {
            if (isDragging) {
                isDragging = false;
                return;
            }

            // It's a click, not a drag
            const pos = getMousePosition(e);
            handleClick(pos.x, pos.y);
        }

        function getMousePosition(e) {
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: touch.clientX,
                y: touch.clientY
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // CLICK HANDLING
        // ============================================
        function handleClick(x, y) {
            // Don't handle clicks if already transitioned
            if (state === "transitioned") return;

            // Convert to normalized device coordinates
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;

            // Raycast
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;

                // State: labelAttached - only label is clickable
                if (state === "labelAttached" && clickedObject.userData.isLabel) {
                    openSignatureOverlay();
                }
                // State: labelRemoved - box is clickable
                else if (state === "labelRemoved" && isBoxClicked(clickedObject)) {
                    handleBoxClick();
                }
            }
        }

        function isBoxClicked(object) {
            // Check if clicked object is part of the box
            return object.parent === boxBody || object === boxBody;
        }

        // ============================================
        // SIGNATURE OVERLAY
        // ============================================
        function openSignatureOverlay() {
            state = "signing";
            document.getElementById('signature-overlay').classList.add('active');
            controls.enabled = false; // Disable orbit during signing
        }

        function closeSignatureOverlay() {
            state = "labelRemoved";
            document.getElementById('signature-overlay').classList.remove('active');
            controls.enabled = true;
        }

        // ============================================
        // LABEL TEAR-OFF ANIMATION
        // ============================================
        function tearOffLabel() {
            const duration = 1500; // ms
            const startTime = Date.now();
            const startPos = labelMesh.position.clone();
            const startRot = labelMesh.rotation.clone();

            function animateTear() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing function
                const eased = 1 - Math.pow(1 - progress, 3);

                // Move up and to the side
                labelMesh.position.x = startPos.x + eased * 3;
                labelMesh.position.y = startPos.y + eased * 2;
                labelMesh.position.z = startPos.z + eased * 1;

                // Random jitter
                const jitter = Math.sin(elapsed * 0.05) * 0.1 * (1 - progress);
                labelMesh.rotation.x = startRot.x + jitter;
                labelMesh.rotation.y = startRot.y + eased * Math.PI * 2 + jitter;
                labelMesh.rotation.z = startRot.z + eased * Math.PI + jitter;

                // Fade out
                labelMesh.material.opacity = 1 - eased;

                if (progress < 1) {
                    requestAnimationFrame(animateTear);
                } else {
                    // Remove label from scene
                    scene.remove(labelMesh);
                }
            }

            animateTear();
        }

        // ============================================
        // BOX SHAKE ANIMATION
        // ============================================
        function shakeBox() {
            const duration = 300; // ms
            const startTime = Date.now();
            const originalPos = boxBody.position.clone();
            const originalRot = boxBody.rotation.clone();

            function animateShake() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Shake intensity decreases over time
                const intensity = (1 - progress) * 0.1;

                // Random offsets
                const offsetX = (Math.random() - 0.5) * intensity;
                const offsetY = (Math.random() - 0.5) * intensity;
                const offsetZ = (Math.random() - 0.5) * intensity;
                const rotX = (Math.random() - 0.5) * intensity;
                const rotZ = (Math.random() - 0.5) * intensity;

                boxBody.position.set(
                    originalPos.x + offsetX,
                    originalPos.y + offsetY,
                    originalPos.z + offsetZ
                );
                boxBody.rotation.set(
                    originalRot.x + rotX,
                    originalRot.y,
                    originalRot.z + rotZ
                );

                if (progress < 1) {
                    requestAnimationFrame(animateShake);
                } else {
                    // Reset to original position
                    boxBody.position.copy(originalPos);
                    boxBody.rotation.copy(originalRot);
                }
            }

            animateShake();
        }

        // ============================================
        // BOX CLICK HANDLING
        // ============================================
        function handleBoxClick() {
            boxClickCount++;

            if (boxClickCount < CLICKS_TO_OPEN) {
                // Just shake
                state = "boxShaking";
                shakeBox();
            } else {
                // Open the box
                state = "boxOpened";
                openBox();
            }
        }

        // ============================================
        // BOX OPEN ANIMATION
        // ============================================
        function openBox() {
            const duration = 2000; // ms
            const startTime = Date.now();
            let pulseInterval;

            function animateOpen() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing function
                const eased = 1 - Math.pow(1 - progress, 3);

                // Open flaps (rotate around pivot)
                boxFlaps.forEach((flap, index) => {
                    const pivot = flap.userData.pivot;
                    const axis = flap.userData.axis;

                    // Calculate rotation angle
                    const angle = eased * Math.PI / 2; // 90 degrees

                    // Reset position to pivot
                    flap.position.copy(pivot);

                    // Apply rotation around pivot
                    if (axis === 'x') {
                        if (index === 0) { // Front flap
                            flap.rotation.x = angle;
                            flap.position.z += Math.sin(angle) * 0.45;
                            flap.position.y -= (1 - Math.cos(angle)) * 0.45;
                        } else { // Back flap
                            flap.rotation.x = -angle;
                            flap.position.z -= Math.sin(angle) * 0.45;
                            flap.position.y -= (1 - Math.cos(angle)) * 0.45;
                        }
                    } else { // axis === 'z'
                        if (index === 2) { // Left flap
                            flap.rotation.z = -angle;
                            flap.position.x -= Math.sin(angle) * 0.45;
                            flap.position.y -= (1 - Math.cos(angle)) * 0.45;
                        } else { // Right flap
                            flap.rotation.z = angle;
                            flap.position.x += Math.sin(angle) * 0.45;
                            flap.position.y -= (1 - Math.cos(angle)) * 0.45;
                        }
                    }
                });

                // Activate golden light
                const lightIntensity = eased * 5;
                insideLight.intensity = lightIntensity;

                // Create particles
                if (progress > 0.3 && Math.random() < 0.3) {
                    createParticle();
                }

                if (progress < 1) {
                    requestAnimationFrame(animateOpen);
                } else {
                    // Start pulsing light
                    pulseInterval = setInterval(() => {
                        const time = Date.now() * 0.001;
                        insideLight.intensity = 3 + Math.sin(time * 2) * 0.5;
                    }, 50);

                    // After 3 seconds of golden effect, transition to photo frame
                    setTimeout(() => {
                        clearInterval(pulseInterval);
                        transitionToPhotoFrame();
                    }, 3000);
                }
            }

            animateOpen();
        }

        // ============================================
        // TRANSITION TO PHOTO FRAME PAGE
        // ============================================
        function transitionToPhotoFrame() {
            // Ensure this only happens once
            if (hasTransitioned) return;
            hasTransitioned = true;
            state = "transitioned";

            // Fade out canvas container
            const canvasContainer = document.getElementById('canvas-container');
            canvasContainer.classList.add('fade-out');

            // After fade out completes, show photo frame page
            setTimeout(() => {
                const framePage = document.getElementById('frame-page');
                framePage.classList.add('visible');

                // Stop rendering 3D scene (performance optimization)
                cancelAnimationFrame(animationId);
            }, 1500); // Match CSS transition duration
        }

        // ============================================
        // PARTICLE SYSTEM
        // ============================================
        function createParticle() {
            const geometry = new THREE.SphereGeometry(0.05, 8, 8);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                transparent: true,
                opacity: 1
            });
            const particle = new THREE.Mesh(geometry, material);

            // Start position (inside box)
            particle.position.set(
                (Math.random() - 0.5) * 0.5,
                1.5,
                (Math.random() - 0.5) * 0.5
            );

            // Velocity
            particle.userData.velocity = {
                x: (Math.random() - 0.5) * 0.02,
                y: 0.02 + Math.random() * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };

            particle.userData.life = 1.0;

            scene.add(particle);
            particles.push(particle);
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];

                // Update position
                particle.position.x += particle.userData.velocity.x;
                particle.position.y += particle.userData.velocity.y;
                particle.position.z += particle.userData.velocity.z;

                // Update life
                particle.userData.life -= 0.01;
                particle.material.opacity = particle.userData.life;

                // Remove dead particles
                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    particles.splice(i, 1);
                }
            }
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        let animationId;
        function animate() {
            animationId = requestAnimationFrame(animate);

            // Update controls
            controls.update();

            // Update particles
            updateParticles();

            // Render
            renderer.render(scene, camera);
        }

        // ============================================
        // START
        // ============================================
        window.addEventListener('load', init);
    </script>
</body>
</html>
